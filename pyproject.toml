[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "utilitybarn"
dependencies = [
  "regex>=2025.11.3"
]
requires-python = ">=3.9"
authors = [
  {name = "Kamil Mahmood"}
]
description = "Random utilities bunched together."
readme = {file = "README.md", content-type = "text/markdown"}
license = {"file" = "LICENSE", "type" = "MIT"}
keywords = [
    "URL Finder",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[project.urls]
Homepage = "https://github.com/kamilmahmood/utilitybarn"

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "pre-commit>=4.3.0",
  "ruff>=0.14.10",
  "pyright>=1.1.407"
]

[tool.setuptools.dynamic]
version = {attr = "utilitybarn.__version__"}

[tool.ruff]
include = ["pyproject.toml", "README.md", "src/**/*.py", "tests/**/*.py"]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
